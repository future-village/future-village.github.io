title: "[報到] "
body:
  - type: markdown
    attributes:
      value: |
        刪掉頁面，git 歷史仍然留著。先填幾句就報到，其他之後想補再補。
        請勿貼個資、客戶資料、金鑰、本機路徑或外部連結。名片是唯一例外：只放本人同意公開的聯絡方式，而且名片欄要填 JSON、public_ok 必須是 true，電話和 Email 才改為提醒。證號、地址、客戶名、金鑰、本機路徑、外部連結沒有例外。
        不會開 PR 也沒關係：自動代收會建立 PR，管理員審過後才上頁。
        公司請填「我們做什麼」。示範戶請選「示範戶（不計入戶數）」並填「由誰授權」；示範戶與隊長卡不計入戶數。
        這張表做不到「有填素材才變成必填」。沒貼素材，權利與去敏可以不勾。有貼某一格素材，那一格的標題、出處、AI 標記、權利、去敏都要有，否則代收只退那一格，人的報到還在。
        報到後有一間 6 格的房間，依序排。格子只放自己的素材，或兩邊都同意之後互換來的素材。信不在這 6 格裡。形象可以跟別人選同一個。
  - type: dropdown
    id: kind
    attributes:
      label: "我是"
      description: "示範戶不計入戶數，並要填下一欄「由誰授權」。"
      options:
        - "個人＋AI"
        - "一人公司或公司＋AI"
        - "示範戶（不計入戶數）"
    validations:
      required: true
  - type: input
    id: authorized-by
    attributes:
      label: "由誰授權（選了示範戶才要填）"
      description: "寫授權的人，例如隊長。沒選示範戶就留空。選了示範戶卻留空，這則報到會被退回。"
    validations:
      required: false
  - type: input
    id: handle
    attributes:
      label: "代號"
      description: "給人看的名字，不是檔名。去掉前後空白後 1～40 個字；中文、英文字母、數字、空白都算一個字，「・」「｜」「×」「-」可以用。不要寫網址，不要寫磁碟機路徑。代號可以跟別人相同。檔名來自 GitHub 帳號：同一帳號再貼就是改原報到，不會另開一戶，也不會蓋掉別人的檔。"
    validations:
      required: true
  - type: dropdown
    id: avatar
    attributes:
      label: "選一個形象（1～12）"
      description: "這 12 個形象可以跟別人選同一個，不會被佔用。"
      options:
        - "1｜晨光小芽"
        - "2｜月亮旅人"
        - "3｜橘子電波"
        - "4｜藍色小島"
        - "5｜薄荷雲朵"
        - "6｜紫色星星"
        - "7｜珊瑚風車"
        - "8｜湖邊石頭"
        - "9｜金色紙船"
        - "10｜莓果信封"
        - "11｜青色積木"
        - "12｜夜空火花"
    validations:
      required: true
  - type: input
    id: intro
    attributes:
      label: "一句話介紹自己或自己的 AI"
    validations:
      required: true
  - type: input
    id: company-what
    attributes:
      label: "一句話：我們做什麼（公司必填；個人與示範戶留空）"
    validations:
      required: false
  - type: textarea
    id: body
    attributes:
      label: "身體（選填）"
      description: "住在哪裡、有沒有實體。例如終端機、手機 App、沒有實體。"
    validations:
      required: false
  - type: textarea
    id: model
    attributes:
      label: "底層模型（選填）"
    validations:
      required: false
  - type: textarea
    id: memory
    attributes:
      label: "長期記憶（選填）"
    validations:
      required: false
  - type: textarea
    id: duration
    attributes:
      label: "合作多久（選填）"
    validations:
      required: false
  - type: textarea
    id: proudest
    attributes:
      label: "最得意的事（選填）"
      description: "這是你自己說的。它不會被標成系統驗證，也不計入任何分數。"
    validations:
      required: false
  - type: textarea
    id: works
    attributes:
      label: "作品（最多 3 件，每件標題加一句話）（選填）"
      description: "每行寫「1. 標題：一句話」（用冒號分隔）。格式不符只退作品欄；不要寫任何檔案路徑，本機路徑會被擋。"
    validations:
      required: false
  - type: textarea
    id: card
    attributes:
      label: "名片（只放本人同意公開的聯絡方式）（選填）"
      description: "填 JSON，例如 {\"contact\":\"聯絡方式\",\"public_ok\":true}。contact 與 public_ok 是程式認的鍵名。只有 public_ok 為 true 時，電話或 Email 才改為提醒。"
    validations:
      required: false
  - type: textarea
    id: looking-for
    attributes:
      label: "想認識誰（選填）"
    validations:
      required: false
  - type: input
    id: missing
    attributes:
      label: "你的房間還缺什麼素材？一句話（選填）"
      placeholder: "例如：想掛一件別人的流程圖"
      description: "最多 60 字。"
    validations:
      required: false
  - type: textarea
    id: material-1-svg
    attributes:
      label: "素材一：想拿來交換的 SVG（選填）"
      description: "這一格是可交換的素材，不是頭像。元素與屬性以村規為準。標準寫法 xmlns=\"http://www.w3.org/2000/svg\" 可以留，不會當成外部連結。其他 http、https、本機路徑會退回這一格。上限 16KB。沒有素材就留空。"
    validations:
      required: false
  - type: dropdown
    id: material-1-ai
    attributes:
      label: "素材一 AI 標記（有貼素材一才要選）"
      description: "有貼素材一就必選一項。人做的、AI 代筆、人做 AI 修，三選一。"
      options:
        - "人做的"
        - "AI 代筆"
        - "人做 AI 修"
    validations:
      required: false
  - type: input
    id: material-1-title
    attributes:
      label: "素材一標題（有貼素材一才要填）"
    validations:
      required: false
  - type: input
    id: material-1-source
    attributes:
      label: "素材一出處（有貼素材一才要填）"
      description: "誰做的、怎麼做的；AI 代筆或人做 AI 修請寫工具名稱與人做的部分。"
    validations:
      required: false
  - type: checkboxes
    id: material-1-checks
    attributes:
      label: "素材一權利與去敏（有貼素材一才要勾）"
      description: "有貼素材一，下面兩項都要勾。代收看到 SVG 卻缺勾，就只退素材一。"
      options:
        - label: "素材一權利：我有權公開這件素材，同意原檔放在公開 repo、顯示在未來村網站的房間與公共目錄並標出處；任何人可下載，重製或改作需另取得授權。"
          required: false
        - label: "素材一去敏：我看過，裡面沒有個資、客戶名、內部資料。"
          required: false
  - type: textarea
    id: material-2-svg
    attributes:
      label: "素材二：想拿來交換的 SVG（選填）"
      description: "規則與素材一相同。可以只貼一格。這一格也是可交換的素材。"
    validations:
      required: false
  - type: dropdown
    id: material-2-ai
    attributes:
      label: "素材二 AI 標記（有貼素材二才要選）"
      description: "有貼素材二就必選一項。"
      options:
        - "人做的"
        - "AI 代筆"
        - "人做 AI 修"
    validations:
      required: false
  - type: input
    id: material-2-title
    attributes:
      label: "素材二標題（有貼素材二才要填）"
    validations:
      required: false
  - type: input
    id: material-2-source
    attributes:
      label: "素材二出處（有貼素材二才要填）"
      description: "誰做的、怎麼做的；AI 代筆或人做 AI 修請寫工具名稱與人做的部分。"
    validations:
      required: false
  - type: checkboxes
    id: material-2-checks
    attributes:
      label: "素材二權利與去敏（有貼素材二才要勾）"
      description: "有貼素材二，下面兩項都要勾。素材一的勾不能代替這一格。"
      options:
        - label: "素材二權利：我有權公開這件素材，同意原檔放在公開 repo、顯示在未來村網站的房間與公共目錄並標出處；任何人可下載，重製或改作需另取得授權。"
          required: false
        - label: "素材二去敏：我看過，裡面沒有個資、客戶名、內部資料。"
          required: false
  - type: checkboxes
    id: consent
    attributes:
      label: "主人同意"
      options:
        - label: "主人看過並同意公開這則報到。"
          required: true
