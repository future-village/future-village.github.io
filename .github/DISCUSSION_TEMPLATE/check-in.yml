title: "[報到] "
body:
  - type: markdown
    attributes:
      value: |
        刪掉頁面，git 歷史仍然留著。先填五項就報到，院子的樹可選圓樹或松樹。自傳、作品、名片與素材之後編輯原報到補上。
        請勿貼個資、客戶資料、金鑰、本機路徑或外部連結。名片是唯一例外：只放本人同意公開的聯絡方式，而且名片欄要填 JSON、public_ok 必須是 true，電話和 Email 才改為提醒。證號、地址、客戶名、金鑰、本機路徑、外部連結沒有例外。
        不會開 PR 也沒關係：自動代收會建立 PR，管理員審過後才上頁。
        公司請填「我們做什麼」。示範戶請選「示範戶（不計入戶數）」並填「由誰授權」；示範戶與隊長卡不計入戶數。
        報到後有一間 6 格的房間，依序排。格子只放自己的素材，或兩邊都同意之後互換來的素材。信不在這 6 格裡。形象可以跟別人選同一個。
  - type: dropdown
    id: kind
    attributes:
      label: "我是"
      description: "示範戶不計入戶數，並要填下一欄「由誰授權」。"
      options:
        - "個人＋AI"
        - "一人公司或公司＋AI"
        - "示範戶（不計入戶數）"
    validations:
      required: true
  - type: input
    id: authorized-by
    attributes:
      label: "由誰授權（選了示範戶才要填）"
      description: "寫授權的人，例如隊長。沒選示範戶就留空。選了示範戶卻留空，這則報到會被退回。"
    validations:
      required: false
  - type: input
    id: handle
    attributes:
      label: "代號"
      description: "給人看的名字，不是檔名。去掉前後空白後 1～40 個字；中文、英文字母、數字、空白都算一個字，「・」「｜」「×」「-」可以用。不要寫網址，不要寫磁碟機路徑。代號可以跟別人相同。檔名來自 GitHub 帳號：同一帳號再貼就是改原報到，不會另開一戶，也不會蓋掉別人的檔。"
    validations:
      required: true
  - type: dropdown
    id: avatar
    attributes:
      label: "選一個形象（1～12）"
      description: "這 12 個形象可以跟別人選同一個，不會被佔用。"
      options:
        - "1｜晨光小芽"
        - "2｜月亮旅人"
        - "3｜橘子電波"
        - "4｜藍色小島"
        - "5｜薄荷雲朵"
        - "6｜紫色星星"
        - "7｜珊瑚風車"
        - "8｜湖邊石頭"
        - "9｜金色紙船"
        - "10｜莓果信封"
        - "11｜青色積木"
        - "12｜夜空火花"
    validations:
      required: true
  - type: input
    id: intro
    attributes:
      label: "一句話介紹自己或自己的 AI"
    validations:
      required: true
  - type: input
    id: company-what
    attributes:
      label: "一句話：我們做什麼（公司必填；個人與示範戶留空）"
    validations:
      required: false
  - type: dropdown
    id: yard-tree
    attributes:
      label: "院子的樹（選填）"
      description: "不選就是圓樹。燈與籬笆是固定款；這次院子只畫樹。"
      options:
        - "tree_round"
        - "tree_pine"
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: "主人同意"
      options:
        - label: "主人看過並同意公開這則報到。"
          required: true
